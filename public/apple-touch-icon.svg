<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180">
  <defs>
    <linearGradient id="bg-gradient-apple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EC4899;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="180" height="180" rx="45" fill="url(#bg-gradient-apple)"/>
  <!-- Simplified baby face -->
  <circle cx="90" cy="90" r="65" fill="#FFE4C4"/>
  <!-- Eyes -->
  <ellipse cx="70" cy="80" rx="9" ry="13" fill="#333"/>
  <ellipse cx="110" cy="80" rx="9" ry="13" fill="#333"/>
  <circle cx="72" cy="78" r="2" fill="#FFF"/>
  <circle cx="112" cy="78" r="2" fill="#FFF"/>
  <!-- Cheeks -->
  <ellipse cx="55" cy="100" rx="12" ry="8" fill="#FFB6C1" opacity="0.5"/>
  <ellipse cx="125" cy="100" rx="12" ry="8" fill="#FFB6C1" opacity="0.5"/>
  <!-- Smile -->
  <path d="M 68 110 Q 90 135 112 110" stroke="#333" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Simple baby bottle icon -->
  <rect x="125" y="45" width="18" height="35" rx="3" fill="#FFF" stroke="#8B5CF6" stroke-width="1"/>
  <rect x="128" y="40" width="12" height="9" rx="2" fill="#8B5CF6"/>
  <path d="M 129 58 Q 136 63 143 58" stroke="#EC4899" stroke-width="1" fill="none"/>
</svg>
