<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EC4899;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="180" height="180" rx="45" fill="url(#bg-gradient)"/>
  <g transform="translate(45, 45) scale(0.175)">
    <!-- Baby face -->
    <circle cx="256" cy="256" r="200" fill="#FFE4C4"/>
    <!-- Eyes -->
    <ellipse cx="200" cy="220" rx="30" ry="40" fill="#333"/>
    <ellipse cx="312" cy="220" rx="30" ry="40" fill="#333"/>
    <circle cx="208" cy="215" r="8" fill="#FFF"/>
    <circle cx="320" cy="215" r="8" fill="#FFF"/>
    <!-- Cheeks -->
    <ellipse cx="150" cy="300" rx="40" ry="25" fill="#FFB6C1" opacity="0.6"/>
    <ellipse cx="362" cy="300" rx="40" ry="25" fill="#FFB6C1" opacity="0.6"/>
    <!-- Smile -->
    <path d="M 180 320 Q 256 400 332 320" stroke="#333" stroke-width="8" fill="none" stroke-linecap="round"/>
    <!-- Baby bottle -->
    <rect x="380" y="100" width="60" height="120" rx="10" fill="#FFF" stroke="#8B5CF6" stroke-width="4"/>
    <rect x="390" y="80" width="40" height="30" rx="5" fill="#8B5CF6"/>
    <path d="M 395 140 Q 410 160 425 140" stroke="#EC4899" stroke-width="4" fill="none"/>
  </g>
</svg>
